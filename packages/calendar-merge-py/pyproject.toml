[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calendar-merge"
version = "0.1.0"
description = "Pure Python logic that merges multiple weekly presence calendars into one"
requires-python = ">=3.12"
dependencies = [
    "share-space-types @ git+https://github.com/alexandremottet/ha-share-space.git#subdirectory=packages/types-py",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/calendar_merge"]
