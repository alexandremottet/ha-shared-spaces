      disabled-text-color: "rgba(244, 246, 252, 0.4)"
      text-primary-color: "#0d1630"
      divider-color: "rgba(255, 255, 255, 0.16)"
      warning-color: "#f2b33a"
      success-color: "#4cc497"
      primary-background-color: "#0d1630"
      secondary-background-color: "rgba(255, 255, 255, 0.08)"
      card-background-color: "rgba(255, 255, 255, 0.1)"
      ha-card-background: "rgba(13, 22, 48, 0.35)"
      ha-card-border-color: "rgba(255, 255, 255, 0.18)"
      ha-card-box-shadow: "0 8px 32px rgba(0, 0, 0, 0.3)"
      mdc-theme-surface: "rgba(20, 32, 66, 0.9)"
      sidebar-background-color: "rgba(13, 22, 48, 0.5)"
