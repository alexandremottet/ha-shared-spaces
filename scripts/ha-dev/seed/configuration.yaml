# Dev instance config, seeded by scripts/start-ha-dev.sh on a fresh .ha-dev/config.
default_config:

homeassistant:
  name: Share Space Dev
  time_zone: Europe/Paris
  country: FR
  unit_system: metric
  currency: EUR

# Demo entities (lights, calendars, media...) to test against.
demo:

frontend:
  themes: !include_dir_merge_named themes

# Simulated devices per area, like real smart plugs + Zigbee sensors (Bureau 1 has 2 radiators).
# Share Space builds each area's thermostat from them (Settings > Heating zones).
input_boolean:
  prise_bureau_1_1:
    name: "Radiateur Bureau 1 1 (état)"
    icon: mdi:radiator
  prise_bureau_1_2:
    name: "Radiateur Bureau 1 2 (état)"
    icon: mdi:radiator
  prise_bureau_2:
    name: "Radiateur Bureau 2 (état)"
    icon: mdi:radiator
  prise_cabane_1:
    name: "Radiateur Cabane 1 (état)"
    icon: mdi:radiator
  prise_cabane_2:
    name: "Radiateur Cabane 2 (état)"
    icon: mdi:radiator
  prise_cabane_3:
    name: "Radiateur Cabane 3 (état)"
    icon: mdi:radiator
  prise_salle_d_impression:
    name: "Radiateur Salle d'impression (état)"
    icon: mdi:radiator
  prise_salle_visio:
    name: "Radiateur Salle visio (état)"
    icon: mdi:radiator
  prise_cuisine:
    name: "Radiateur Cuisine (état)"
    icon: mdi:radiator

input_number:
  outdoor_temperature:
    name: "Température extérieure"
    min: -15
    max: 35
    step: 0.5
    initial: 8
    unit_of_measurement: "°C"
  temperature_bureau_1:
    name: "Température Bureau 1 (réglage)"
    min: 5
    max: 30
    step: 0.5
    initial: 20.5
    unit_of_measurement: "°C"
  temperature_bureau_2:
    name: "Température Bureau 2 (réglage)"
    min: 5
    max: 30
    step: 0.5
    initial: 19.0
    unit_of_measurement: "°C"
  temperature_cabane_1:
    name: "Température Cabane 1 (réglage)"
    min: 5
    max: 30
    step: 0.5
    initial: 16.5
    unit_of_measurement: "°C"
  temperature_cabane_2:
    name: "Température Cabane 2 (réglage)"
    min: 5
    max: 30
    step: 0.5
    initial: 15.0
    unit_of_measurement: "°C"
  temperature_cabane_3:
    name: "Température Cabane 3 (réglage)"
    min: 5
    max: 30
    step: 0.5
    initial: 17.5
    unit_of_measurement: "°C"
  temperature_salle_d_impression:
    name: "Température Salle d'impression (réglage)"
    min: 5
    max: 30
    step: 0.5
    initial: 18.0
    unit_of_measurement: "°C"
  temperature_salle_visio:
    name: "Température Salle visio (réglage)"
    min: 5
    max: 30
    step: 0.5
    initial: 21.0
    unit_of_measurement: "°C"
  temperature_cuisine:
    name: "Température Cuisine (réglage)"
    min: 5
    max: 30
    step: 0.5
    initial: 19.5
    unit_of_measurement: "°C"

template:
  - switch:
      - name: "Radiateur Bureau 1 1"
        unique_id: radiateur_bureau_1_1
        icon: mdi:radiator
        state: "{{ is_state('input_boolean.prise_bureau_1_1', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.prise_bureau_1_1
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.prise_bureau_1_1
      - name: "Radiateur Bureau 1 2"
        unique_id: radiateur_bureau_1_2
        icon: mdi:radiator
        state: "{{ is_state('input_boolean.prise_bureau_1_2', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.prise_bureau_1_2
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.prise_bureau_1_2
      - name: "Radiateur Bureau 2"
        unique_id: radiateur_bureau_2
        icon: mdi:radiator
        state: "{{ is_state('input_boolean.prise_bureau_2', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.prise_bureau_2
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.prise_bureau_2
      - name: "Radiateur Cabane 1"
        unique_id: radiateur_cabane_1
        icon: mdi:radiator
        state: "{{ is_state('input_boolean.prise_cabane_1', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.prise_cabane_1
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.prise_cabane_1
      - name: "Radiateur Cabane 2"
        unique_id: radiateur_cabane_2
        icon: mdi:radiator
        state: "{{ is_state('input_boolean.prise_cabane_2', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.prise_cabane_2
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.prise_cabane_2
      - name: "Radiateur Cabane 3"
        unique_id: radiateur_cabane_3
        icon: mdi:radiator
        state: "{{ is_state('input_boolean.prise_cabane_3', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.prise_cabane_3
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.prise_cabane_3
      - name: "Radiateur Salle d'impression"
        unique_id: radiateur_salle_d_impression
        icon: mdi:radiator
        state: "{{ is_state('input_boolean.prise_salle_d_impression', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.prise_salle_d_impression
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.prise_salle_d_impression
      - name: "Radiateur Salle visio"
        unique_id: radiateur_salle_visio
        icon: mdi:radiator
        state: "{{ is_state('input_boolean.prise_salle_visio', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.prise_salle_visio
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.prise_salle_visio
      - name: "Radiateur Cuisine"
        unique_id: radiateur_cuisine
        icon: mdi:radiator
        state: "{{ is_state('input_boolean.prise_cuisine', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.prise_cuisine
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.prise_cuisine
  - sensor:
      # Outdoor reading, picked in Settings for rules that follow the outdoor temperature.
      - name: "Outdoor temperature"
        unique_id: outdoor_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state: "{{ states('input_number.outdoor_temperature') }}"
      - name: "Température Bureau 1"
        unique_id: temperature_bureau_1
        unit_of_measurement: "°C"
        device_class: temperature
        state: "{{ states('input_number.temperature_bureau_1') }}"
      - name: "Température Bureau 2"
        unique_id: temperature_bureau_2
        unit_of_measurement: "°C"
        device_class: temperature
        state: "{{ states('input_number.temperature_bureau_2') }}"
      - name: "Température Cabane 1"
        unique_id: temperature_cabane_1
        unit_of_measurement: "°C"
        device_class: temperature
        state: "{{ states('input_number.temperature_cabane_1') }}"
      - name: "Température Cabane 2"
        unique_id: temperature_cabane_2
        unit_of_measurement: "°C"
        device_class: temperature
        state: "{{ states('input_number.temperature_cabane_2') }}"
      - name: "Température Cabane 3"
        unique_id: temperature_cabane_3
        unit_of_measurement: "°C"
        device_class: temperature
        state: "{{ states('input_number.temperature_cabane_3') }}"
      - name: "Température Salle d'impression"
        unique_id: temperature_salle_d_impression
        unit_of_measurement: "°C"
        device_class: temperature
        state: "{{ states('input_number.temperature_salle_d_impression') }}"
      - name: "Température Salle visio"
        unique_id: temperature_salle_visio
        unit_of_measurement: "°C"
        device_class: temperature
        state: "{{ states('input_number.temperature_salle_visio') }}"
      - name: "Température Cuisine"
        unique_id: temperature_cuisine
        unit_of_measurement: "°C"
        device_class: temperature
        state: "{{ states('input_number.temperature_cuisine') }}"
