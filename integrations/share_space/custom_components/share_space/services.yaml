set_calendar:
  name: Set calendar
  description: Save a person's weekly planning into their Home Assistant Schedule helper (created when missing).
  fields:
    person:
      name: Person
      description: The person entity this calendar belongs to.
      required: true
      selector:
        entity:
          domain: person
    calendar:
      name: Calendar
      description: Map of weekday to a list of {start, end} "HH:MM" presence ranges.
      required: true
      example: '{"monday": [{"start": "09:00", "end": "17:00"}]}'
      selector:
        object:

assign_person_area:
  name: Assign person area
  description: Set the Home Assistant area of a person entity.
  fields:
    person:
      name: Person
      description: The person entity to assign.
      required: true
      selector:
        entity:
          domain: person
    area:
      name: Area
      description: The area to assign this person to.
      required: true
      selector:
        area:

query_occupancy:
  name: Query occupancy
  description: Check whether an area has planned presence in given time windows. Returns {occupied, matches}.
  fields:
    area:
      name: Area
      description: The area to query.
      required: true
      selector:
        area:
    windows:
      name: Windows
      description: List of {start, end} "HH:MM" windows. A window matches when an occupied slot starts within [start, end).
      required: true
      example: '[{"start": "11:00", "end": "12:00"}, {"start": "13:00", "end": "14:00"}]'
      selector:
        object:
    match:
      name: Match
      description: Whether all windows or any window must match.
      required: false
      default: all
      selector:
        select:
          options:
            - all
            - any
    day:
      name: Day
      description: today, tomorrow or a weekday name.
      required: false
      default: today
      selector:
        select:
          options:
            - today
            - tomorrow
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
