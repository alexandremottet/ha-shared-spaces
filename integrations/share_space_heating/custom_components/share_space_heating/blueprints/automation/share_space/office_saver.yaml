# share_space_blueprint_version: 2
blueprint:
  name: Share Space - Office saver
  description: >
    Comfort while the area is occupied, preheat before the next occupied period,
    setback between two working days, off otherwise.
  domain: automation
  input:
    zone:
      name: Heating zone
      selector:
        entity:
          integration: share_space_heating
          domain: sensor
    area:
      name: Share Space area id
      description: Area id used in binary_sensor.share_space_<area> (e.g. open_space).
      selector:
        text:
    comfort_temp:
      name: Comfort temperature
      default: 21
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°"
    setback_temp:
      name: Setback temperature between working days
      default: 16
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°"
    preheat_hours:
      name: Preheat hours before the next occupied period
      default: 6
      selector:
        number:
          min: 0
          max: 48
          step: 0.5
          unit_of_measurement: h
    max_gap_hours:
      name: Longest gap still treated as between working days
      default: 24
      selector:
        number:
          min: 1
          max: 72
          step: 1
          unit_of_measurement: h

mode: queued
max: 5
max_exceeded: silent

# Rules come from presets.py and are evaluated by share_space_heating.run_rules; this only decides when.
trigger_variables:
  area: !input area

triggers:
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ 'binary_sensor.share_space_' ~ area }}"
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ 'sensor.share_space_' ~ area ~ '_next_on' }}"
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ 'sensor.share_space_' ~ area ~ '_previous_off' }}"
  # Time and preheat edges are picked up within a minute.
  - trigger: time_pattern
    minutes: "*"
  - trigger: homeassistant
    event: start

actions:
  - action: share_space_heating.run_rules
    data:
      entity_id: !input zone
      area: !input area
      preset: office_saver
      inputs:
        comfort_temp: !input comfort_temp
        setback_temp: !input setback_temp
        preheat_hours: !input preheat_hours
        max_gap_hours: !input max_gap_hours
