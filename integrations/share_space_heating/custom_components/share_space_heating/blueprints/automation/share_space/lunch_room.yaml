# share_space_blueprint_version: 2
blueprint:
  name: Share Space - Lunch room
  description: >
    Heat at lunch only when the planning shows someone at the end of the morning
    and at the start of the afternoon.
  domain: automation
  input:
    zone:
      name: Heating zone
      selector:
        entity:
          integration: share_space_heating
          domain: sensor
    area:
      name: Share Space area id
      description: Area id used in binary_sensor.share_space_<area> (e.g. kitchen).
      selector:
        text:
    morning_start:
      name: End of morning window start
      default: "11:00:00"
      selector:
        time:
    morning_end:
      name: End of morning window end
      default: "12:00:00"
      selector:
        time:
    afternoon_start:
      name: Start of afternoon window start
      default: "13:00:00"
      selector:
        time:
    afternoon_end:
      name: Start of afternoon window end
      default: "14:00:00"
      selector:
        time:
    heat_start:
      name: Heating starts
      default: "11:00:00"
      selector:
        time:
    heat_end:
      name: Heating ends
      default: "14:00:00"
      selector:
        time:
    temperature:
      name: Lunch temperature
      default: 20
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°"
    match:
      name: Windows that must be occupied
      default: all
      selector:
        select:
          options:
            - all
            - any

mode: queued
max: 5
max_exceeded: silent

# Rules come from presets.py and are evaluated by share_space_heating.run_rules; this only decides when.
trigger_variables:
  area: !input area

triggers:
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ 'binary_sensor.share_space_' ~ area }}"
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ 'sensor.share_space_' ~ area ~ '_next_on' }}"
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ 'sensor.share_space_' ~ area ~ '_previous_off' }}"
  # Time and preheat edges are picked up within a minute.
  - trigger: time_pattern
    minutes: "*"
  - trigger: homeassistant
    event: start

actions:
  - action: share_space_heating.run_rules
    data:
      entity_id: !input zone
      area: !input area
      preset: lunch_room
      inputs:
        morning_start: !input morning_start
        morning_end: !input morning_end
        afternoon_start: !input afternoon_start
        afternoon_end: !input afternoon_end
        heat_start: !input heat_start
        heat_end: !input heat_end
        temperature: !input temperature
        match: !input match
